<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f2d"/>
      <stop offset="50%" stop-color="#2a1654"/>
      <stop offset="100%" stop-color="#0b0818"/>
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Outer Wallet Body -->
  <g filter="url(#glow)">
    <rect x="96" y="144" width="320" height="230" rx="36" fill="url(#walletGrad)" />
    <!-- Wallet Flap & Clasp -->
    <path d="M96 190 C 130 144, 382 144, 416 190" fill="none" stroke="#c084fc" stroke-width="12" stroke-linecap="round"/>
    <rect x="290" y="215" width="130" height="85" rx="24" fill="#140f2d" stroke="#c084fc" stroke-width="8"/>
    <circle cx="355" cy="257" r="16" fill="#38bdf8"/>
    <circle cx="355" cy="257" r="8" fill="#ffffff"/>
  </g>
</svg>
